name: Processar notificações financeiras
on:
  schedule:
    - cron: '5 11 * * *'
  workflow_dispatch:
concurrency:
  group: financial-notifications
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar configuração
        env:
          ENDPOINT: ${{ secrets.NOTIFICATION_ENDPOINT }}
          TOKEN: ${{ secrets.NOTIFICATION_CRON_SECRET }}
        run: test -n "$ENDPOINT" && test -n "$TOKEN"
      - name: Gerar e enviar notificações
        env:
          ENDPOINT: ${{ secrets.NOTIFICATION_ENDPOINT }}
          TOKEN: ${{ secrets.NOTIFICATION_CRON_SECRET }}
        run: curl --fail-with-body --retry 2 --max-time 120 -X POST -H "Authorization: Bearer $TOKEN" "$ENDPOINT"
